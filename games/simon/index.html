<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Simon | Pablo's Arcade</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="game-container">

    <header>

        <button id="backButton">

            ⬅ Back

        </button>

        <h1>

            🟩 Simon

        </h1>

        <div class="stats">

            <div>

                Level

                <span id="level">

                    1

                </span>

            </div>

        </div>

    </header>

    <main>

        <div
            id="board"
            class="board">

            <div
                class="tile green"
                data-id="0">

            </div>

            <div
                class="tile red"
                data-id="1">

            </div>

            <div
                class="tile yellow"
                data-id="2">

            </div>

            <div
                class="tile blue"
                data-id="3">

            </div>

        </div>

    </main>

    <footer>

        <button id="startButton">

            ▶ Start

        </button>

        <button id="restartButton">

            🔄 Restart

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>

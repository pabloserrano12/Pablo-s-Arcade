<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dino Runner | Pablo's Arcade</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="game-container">

    <header>

        <button id="backButton">
            ⬅ Back
        </button>

        <h1>
            🦖 Dino Runner
        </h1>

        <div class="stats">

            <div>
                Score
                <span id="score">0</span>
            </div>

            <div>
                Best
                <span id="best">0</span>
            </div>

        </div>

    </header>

    <main>

        <div
            id="gameArea"
            class="game-area">

            <div
                id="cloud"
                class="cloud">
                ☁️
            </div>

            <div
                id="dino"
                class="dino">
                🦖
            </div>

            <div
                id="ground"
                class="ground">
            </div>

        </div>

        <p id="message">
            Press SPACE or tap to jump!
        </p>

    </main>

    <footer>

        <button id="startButton">
            ▶ Start
        </button>

        <button id="restartButton">
            🔄 Restart
        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>

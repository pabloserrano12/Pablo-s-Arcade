<!DOCTYPE html>
<html lang="en">

<head>

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Memory | Pablo's Arcade</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="menu" class="menu">

<h1>

🧠 Memory

</h1>

<p>

Choose a game mode

</p>

<button id="soloButton">

👤 Solo

</button>

<button id="playerButton">

👥 Two Players

</button>

</div>

<div id="game" class="game hidden">

<header>

<button id="backButton">

⬅ Back

</button>

<h2>

🧠 Memory

</h2>

<div class="stats">

<div>

Moves

<span id="moves">

0

</span>

</div>

<div>

Pairs

<span id="pairs">

0

</span>

</div>

<div id="playerBox">

Player

<span id="currentPlayer">

1

</span>

</div>

</div>

</header>

<main>

<div id="board" class="board">

</div>

</main>

<footer>

<button id="restartButton">

🔄 Restart

</button>

<button id="menuButton">

🏠 Menu

</button>

</footer>

</div>

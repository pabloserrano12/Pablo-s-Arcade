<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Breakout | Pablo's Arcade</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">

<header>

<button id="backButton">

⬅ Back

</button>

<h1>

🧱 Breakout

</h1>

<div class="stats">

<div>

Score

<span id="score">

0

</span>

</div>

<div>

Lives

<span id="lives">

3

</span>

</div>

</div>

</header>

<main>

<canvas

id="gameCanvas"

width="900"

height="600">

</canvas>

</main>

<section class="mobileControls">

<button id="left">

⬅

</button>

<button id="right">

➡

</button>

</section>

<footer>

<button id="pauseButton">

⏸ Pause

</button>

<button id="restartButton">

🔄 Restart

</button>

</footer>

</div>

<script src="script.js"></script>

</body>

</html>

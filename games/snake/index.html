<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0">

    <title>Snake | Pablo's Arcade</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">

    <header>

        <button id="backButton">

            ⬅ Back

        </button>

        <h1>

            🐍 Snake

        </h1>

        <div class="score-box">

            Score

            <span id="score">

                0

            </span>

        </div>

    </header>

    <main>

        <canvas
            id="gameCanvas"
            width="600"
            height="600">

        </canvas>

    </main>

    <section class="mobile-controls">

        <button
            id="up">

            ▲

        </button>

        <div>

            <button id="left">

                ◀

            </button>

            <button id="down">

                ▼

            </button>

            <button id="right">

                ▶

            </button>

        </div>

    </section>

    <footer>

        <button id="pause">

            ⏸ Pause

        </button>

        <button id="restart">

            🔄 Restart

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>

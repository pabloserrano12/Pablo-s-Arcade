<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Connect 4 | Pablo's Arcade</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="menu" class="menu">

<h1>

🔴 Connect 4

</h1>

<p>

Choose a game mode

</p>

<button id="aiButton">

🤖 Player vs AI

</button>

<button id="playerButton">

👥 Player vs Player

</button>

</div>

<div id="game" class="game hidden">

<header>

<button id="backButton">

⬅ Back

</button>

<h2>

🔴 Connect 4

</h2>

<div class="stats">

<div>

Turn

<span id="turn">

Red

</span>

</div>

</div>

</header>

<main>

<div id="board" class="board">

</div>

</main>

<footer>

<button id="restartButton">

🔄 Restart

</button>

<button id="menuButton">

🏠 Menu

</button>

</footer>

</div>

<script src="script.js"></script>

</body>

</html>

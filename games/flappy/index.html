<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Flappy Bird | Pablo's Arcade</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">

<header>

<button id="backButton">

⬅ Back

</button>

<h1>

🐤 Flappy Bird

</h1>

<div class="stats">

<div>

Score

<span id="score">

0

</span>

</div>

<div>

Best

<span id="best">

0

</span>

</div>

</div>

</header>

<main>

<canvas
id="gameCanvas"
width="450"
height="700">

</canvas>

</main>

<section class="mobileControls">

<button id="jumpButton">

⬆ Jump

</button>

</section>

<footer>

<button id="restartButton">

🔄 Restart

</button>

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
